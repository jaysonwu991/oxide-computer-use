name: Release

# A `v*` tag builds what `install.sh` downloads: the workflow stamps the tag
# into the crate, builds both macOS targets, and attaches the archives, their
# checksums, the manifest the installer reads and the installer itself to the
# release that was already drafted.
#
# The release itself is not made here. `.github/workflows/release-drafter.yml`
# keeps a draft in step with `main`, and publishing that draft is what creates
# the release and the tag that starts this workflow. A tag pushed by hand has no
# release behind it, so the last job says so instead of inventing one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
          - target: x86_64-apple-darwin
            platform: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Stamp the tag into the crate
        run: |
          set -euo pipefail
          ./scripts/set-version.sh "${GITHUB_REF_NAME}"
          cargo update --workspace
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          asset="computer-use-${{ matrix.platform }}.tar.gz"
          staged="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/computer-use" "${staged}/computer-use"
          (
            cd "${staged}"
            tar -czf "${asset}" computer-use
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${asset}" > "${asset}.sha256"
            else
              shasum -a 256 "${asset}" > "${asset}.sha256"
            fi
          )
          cp "${staged}/${asset}" "${staged}/${asset}.sha256" .
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: |
            computer-use-*.tar.gz
            computer-use-*.tar.gz.sha256
          if-no-files-found: error

  attach:
    name: attach the release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true
      - name: Write the installer manifest
        run: |
          set -euo pipefail
          {
            printf 'version: %s\n' "${GITHUB_REF_NAME}"
            # One key per platform: the token `install.sh` asks for, and the
            # name of the archive it carries for it.
            for platform in macos-arm64 macos-x64; do
              printf '%s: computer-use-%s.tar.gz\n' "${platform}" "${platform}"
            done
          } > assets/computer-use-manifest
          cat assets/computer-use-manifest
      # The drafter's draft is the release. Publishing it creates the tag this
      # workflow runs on, so by now the release exists; a tag pushed by hand has
      # no draft behind it, and creating one here would ship notes nobody
      # reviewed.
      - name: Require the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          {
            echo "::error::no published release for ${GITHUB_REF_NAME}"
            echo "Publishing the draft release for this version (Releases → the draft"
            echo "→ Edit → Publish release) is what creates the tag and the release."
            echo "Publish it, then re-run this job so the assets are attached to it."
          } >&2
          exit 1
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -exec gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber {} \;
          gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber install.sh
