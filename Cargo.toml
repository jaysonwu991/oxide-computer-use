[package]
name = "oxide-reins"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Computer Use MCP server and CLI: drive desktop apps through native accessibility APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jaysonwu991/oxide-reins"

[[bin]]
name = "oxide-reins"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
